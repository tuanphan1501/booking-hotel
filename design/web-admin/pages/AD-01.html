    />

  <body class="proto" data-screen="AD-01">
    <script src="../js/icons.js"></script>
    <div class="adm solo">
      <div class="amain">
        <div
          style="
            min-height: 620px;
            display: grid;
            place-items: center;
            padding: 40px 16px;
            background: radial-gradient(60% 50% at 0% 0%, rgba(242, 192, 99, 0.22), transparent 70%),
              radial-gradient(55% 55% at 100% 100%, rgba(180, 35, 24, 0.14), transparent 70%), var(--paper);
          "
        >
          <div class="col g16" style="width: 400px; align-items: stretch">
            <div
              class="col g16"
              style="
                background: #fff;
                border-radius: 24px;
                padding: 32px 30px 26px;
                box-shadow:
                  0 0 0 1px var(--line),
                  0 24px 60px rgba(43, 26, 22, 0.1);
              "
            >
              <div class="row g8" style="justify-content: center">
                <span
                  style="
                    width: 40px;
                    height: 40px;
                    border-radius: 10px;
                    background: var(--brand);
                    display: grid;
                    place-items: center;
                    color: #fff;
                  "
                  ><svg class="i" aria-hidden="true" style="width: 24px; height: 24px">
                    <use href="#i-logo" /></svg></span
                ><span style="font-size: 25px; font-weight: 700; letter-spacing: -0.4px"
                  >Vivu <span style="color: var(--brand)">Stay</span></span
                >
              </div>
              <div class="col g4 center">
                <div class="t-xl"><span data-ja="管理者ログイン">Đăng nhập quản trị</span></div>
                <div class="t-s sub">
                  <span data-ja="おかえりなさい。予約とホテル運営を管理するにはログインしてください。"
                    >Chào mừng trở lại! Đăng nhập để quản lý đặt phòng và vận hành khách sạn.</span
                  >
                </div>
              </div>
              <div class="fld">
                <label><b class="ann">1</b>Email</label>
                <div class="inp">phtuancntt@gmail.com</div>
              </div>
              <div class="fld">
                <label><b class="ann">2</b><span data-ja="パスワード">Mật khẩu</span></label>
                <div class="inp focus">
                  <span class="grow">••••••••••</span><svg class="i" aria-hidden="true"><use href="#i-eye" /></svg>
                </div>
              </div>
              <button class="btn full">
                <b class="ann">3</b><span data-ja="次へ">Tiếp tục</span
                ><svg class="i s" aria-hidden="true"><use href="#i-chev" /></svg>
              </button>
              <div class="row t-s sub" style="justify-content: center">
                <span class="divider grow"></span><span data-ja="または">hoặc</span><span class="divider grow"></span>
              </div>
              <button class="btn full sec">
                <b class="ann">4</b><svg class="i" aria-hidden="true"><use href="#i-google" /></svg
                ><span data-ja="Googleでログイン">Đăng nhập bằng Google</span>
              </button>
              <div
                class="row g8 t-xs"
                style="
                  align-items: flex-start;
                  padding: 10px 12px;
                  border-radius: 12px;
                  background: var(--line-2);
                  color: var(--ink-2);
                "
              >
                <svg class="i s brand" aria-hidden="true"><use href="#i-shield" /></svg
                ><span
                  ><span data-ja="2段階認証：パスワードの後、確認コードをメールでお送りします。"
                    >Bảo mật 2 lớp: sau mật khẩu, mã xác nhận sẽ được gửi tới email của bạn.</span
                  ></span
                >
              </div>
              <a class="t-s brand w6 center"
                ><b class="ann">5</b
                ><span data-ja="パスワードを忘れた場合は本部管理者へ">Quên mật khẩu? Liên hệ Super Admin.</span></a
              >
            </div>
            <div class="row g4" style="justify-content: center">
              <b class="ann">L</b>
              <div class="ab-lang">
                <button data-setlang="vi" aria-pressed="true">Tiếng Việt</button
                ><button data-setlang="ja" aria-pressed="false">日本語</button>
              </div>
            </div>
            <div class="t-xs sub center">
              © 2026 Vivu Stay · <span data-ja="社内管理システム">Hệ thống quản trị nội bộ</span>
            </div>
          </div>
        </div>
      </div>
    </div>

        <optgroup label="Khách hàng">
          <option value="AD-11">AD-11 · Khuyến mãi &amp; voucher</option>
