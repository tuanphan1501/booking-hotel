# Unsigned iOS build (.ipa) for sideloading with a free Apple ID (Sideloadly / AltStore).
# Manual trigger only: macOS minutes are expensive.
name: iOS

on:
  workflow_dispatch:
    inputs:
      api_base_url:
        description: "Backend API root baked into the app"
        required: true
        default: "http://192.168.3.139:8000/api/v1"

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: mobile

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Build unsigned app
        run: flutter build ios --release --no-codesign --dart-define=API_BASE_URL=${{ inputs.api_base_url }}

      - name: Package .ipa
        run: |
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qr vivustay-unsigned.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: vivustay-ios-unsigned
          path: mobile/vivustay-unsigned.ipa
          retention-days: 7
