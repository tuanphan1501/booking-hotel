# Backend quality gate: code style (Pint), static analysis (Larastan) and tests on PostgreSQL 16.
name: Backend

on:
  pull_request:
    paths: ["backend/**", ".github/workflows/backend.yml"]
  push:
    branches: [develop, main]
    paths: ["backend/**", ".github/workflows/backend.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: vivustay_test
          POSTGRES_USER: vivustay
          POSTGRES_PASSWORD: vivustay
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U vivustay -d vivustay_test"
          --health-interval 5s --health-timeout 5s --health-retries 20

    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_USERNAME: vivustay
      DB_PASSWORD: vivustay

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: pdo_pgsql, mbstring, fileinfo, gd
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare environment
        run: cp .env.example .env && php artisan key:generate

      - name: Code style (Pint)
        run: vendor/bin/pint --test

      - name: Static analysis (Larastan)
        run: vendor/bin/phpstan analyse --memory-limit=1G --no-progress

      - name: Tests
        run: php artisan test
