name: vivu_stay
description: "Vivu Stay — hotel booking app for guests (iOS & Android)."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any

  # State management & navigation
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2

  # Networking & storage
  dio: ^5.7.0
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.3

  # UI
  flutter_svg: ^2.0.16
  google_fonts: ^6.2.1
  characters: ^1.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.2

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/brand/
    - assets/illustrations/
    - assets/icons/

# App icon generated from the brand kit: dart run flutter_launcher_icons
flutter_launcher_icons:
  image_path: "assets/brand/app-icon-1024.png"
  android: true
  ios: true
  remove_alpha_ios: true
  adaptive_icon_background: "#B42318"
  adaptive_icon_foreground: "assets/brand/app-icon-foreground.png"
