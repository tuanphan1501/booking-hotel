# Local development services for Vivu Stay: PostgreSQL 16, Redis 7 and Mailpit.
# Start: docker compose up -d   ·   Outgoing mail UI: http://localhost:8025
# Backend in Docker too (no local PHP needed): docker compose --profile app up -d --build --wait
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: vivustay
      POSTGRES_USER: vivustay
      POSTGRES_PASSWORD: vivustay
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/docker/postgres-init.sql:/docker-entrypoint-initdb.d/01-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vivustay -d vivustay"]
      interval: 5s
      retries: 30
      start_period: 60s

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  mailpit:
    image: axllent/mailpit:v1.20
    ports:
      - "1025:1025"
      - "8025:8025"

  # Laravel API + Web Admin on http://localhost:8000 (optional — enable with --profile app).
  app:
    profiles: ["app"]
    build: ./backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      REDIS_HOST: redis
      MAIL_HOST: mailpit
      APP_URL: http://localhost:8000
    ports:
      - "8000:8000"
    volumes:
      - app-storage:/var/www/html/storage/app/public

volumes:
  pgdata:
  app-storage:
