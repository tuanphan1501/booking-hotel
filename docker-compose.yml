# Local development services for Vivu Stay: PostgreSQL 16, Redis 7 and Mailpit.
# Start: docker compose up -d   ·   Outgoing mail UI: http://localhost:8025
# Full stack with local HTTPS domains: docker compose --profile app up -d --build --wait
#   https://admin.vivustay.localhost · https://api.vivustay.localhost · https://mail.vivustay.localhost
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: vivustay
      POSTGRES_USER: vivustay
      POSTGRES_PASSWORD: vivustay
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/docker/postgres-init.sql:/docker-entrypoint-initdb.d/01-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vivustay -d vivustay"]
      interval: 5s
      retries: 30
      start_period: 60s

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  mailpit:
    image: axllent/mailpit:v1.20
    ports:
      - "1025:1025"
      - "8025:8025"

  # Laravel API + Web Admin on http://localhost:8000 (optional — enable with --profile app).
  app:
    profiles: ["app"]
    build: ./backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      REDIS_HOST: redis
      # Mail: Mailpit by default; set MAIL_* in ./.env (see .env.example) to deliver to real inboxes (Gmail SMTP).
      MAIL_HOST: ${MAIL_HOST:-mailpit}
      MAIL_PORT: ${MAIL_PORT:-1025}
      MAIL_SCHEME: ${MAIL_SCHEME:-}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-no-reply@vivustay.vn}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      APP_URL: https://admin.vivustay.localhost
    ports:
      - "8000:8000"
    volumes:
      - app-storage:/var/www/html/storage/app/public

  # HTTPS reverse proxy for the local domains (see docker/caddy/Caddyfile).
  caddy:
    profiles: ["app"]
    image: caddy:2.8-alpine
    depends_on:
      - app
      - mailpit
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data

volumes:
  caddy-data:
  pgdata:
  app-storage:
